worker_processes auto;
events { worker_connections 1024; }
http {
  sendfile on;
  gzip on;
  client_max_body_size 512m;

  upstream backend { server backend:8000; }
  upstream admin   { server admin:3000; }

  server {
    listen 80;
    server_name www.miidea.top miidea.top;
    client_max_body_size 512m;

    location /.well-known/acme-challenge/ {
      alias /var/www/certbot/.well-known/acme-challenge/;
      default_type text/plain;
      try_files $uri =404;
    }

    # Backend health check used by mobile app initialization
    location = /health {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ { proxy_pass http://backend; }

    # Keep links used by clients and email messages stable while the Next.js
    # application itself is mounted under `/admin`.
    location = /verify-email { proxy_pass http://admin/admin/verify-email; }
    location = /privacy { proxy_pass http://admin/admin/privacy; }
    location = /client-portal { proxy_pass http://admin/admin/client-portal; }

    # Serve approved portfolio assets first.  Requests without a matching
    # static asset (including `/admin`) retain the existing Next.js behavior.
    location / {
      root /usr/share/nginx/html;
      index index.html;
      autoindex off;
      try_files $uri $uri/ @admin;
    }

    location @admin {
      proxy_pass http://admin;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }

  # HTTPS server block
  server {
    listen 443 ssl http2;
    server_name www.miidea.top miidea.top;

    ssl_certificate     /etc/letsencrypt/live/www.miidea.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.miidea.top/privkey.pem;

    location /.well-known/acme-challenge/ {
      alias /var/www/certbot/.well-known/acme-challenge/;
      default_type text/plain;
      try_files $uri =404;
    }

    location = /health {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /static/ { proxy_pass http://backend; }

    location = /verify-email { proxy_pass http://admin/admin/verify-email; }
    location = /privacy { proxy_pass http://admin/admin/privacy; }
    location = /client-portal { proxy_pass http://admin/admin/client-portal; }

    location / {
      root /usr/share/nginx/html;
      index index.html;
      autoindex off;
      try_files $uri $uri/ @admin;
    }

    location @admin {
      proxy_pass http://admin;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }
}
